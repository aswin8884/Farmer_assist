{% extends 'admin/admin_base.html' %}
{% block content %}

<div class="container-fluid py-4">
    <div class="row" style="margin-top: 50px;">
        <div class="col-md-12 mt-4">
            <div class="card">
                <div class="card-header pb-0 px-3">
                    <h6 class="mb-0">Farmer Information</h6>
                </div>
                <div class="card-body pt-4 p-3">
                    <ul class="list-group">
                        <li class="list-group-item border-0 d-flex flex-column p-4 mb-2 bg-gray-100 border-radius-lg">
                            <!-- Center the profile picture above the details -->
                            <div class="text-center mb-4">
                                <div class="mb-3" style="width: 150px; margin: 0 auto;">
                                    <img src="../static/media/{{ farmer.profile_picture }}" class="img-fluid border-radius-sm" alt="{{ farmer.name }}" style="width: 100%; height: auto; object-fit: cover;">
                                </div>
                                <h6 class="text-sm">{{ farmer.name }}</h6>
                            </div>
                            <div class="d-flex flex-column">
                                <span class="mb-2 text-xs">Address: 
                                    <span class="text-dark font-weight-bold ms-sm-2">{{ farmer.address }}</span>
                                </span>
                                <span class="mb-2 text-xs">Contact: 
                                    <span class="text-dark ms-sm-2 font-weight-bold">{{ farmer.contact }}</span>
                                </span>
                                <span class="mb-2 text-xs">Email: 
                                    <span class="text-dark ms-sm-2 font-weight-bold">{{ farmer.email }}</span>
                                </span>

                                <div class="mt-3">
                                    <a href="../static/media/{{ farmer.id_proof }}" class="btn btn-info btn-icon-text">
                                        ID Proof <i class="ti-printer btn-icon-append"></i>
                                    </a>
                                </div>
                            </div>

                            <!-- Accept and Reject Buttons at the bottom -->
                            <div class="mt-4 text-end">
                                <a href="/admin_accept_farmer_request?id={{ farmer.id }}">
                                    <button type="button" class="btn btn-success btn-icon-text">
                                        Accept <i class=" btn-icon-append"></i>
                                    </button>
                                </a>
                                <a href="/admin_reject_farmer_request?id={{ farmer.id }}">
                                    <button type="button" class="btn btn-danger btn-icon-text">
                                        Reject <i class=" btn-icon-append"></i>
                                    </button>
                                </a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

{% if messages %}
{% for m in messages %}
<script>alert("{{ m }}")</script>
{% endfor %}
{% endif %}

{% endblock %}
