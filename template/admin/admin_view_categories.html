{% extends 'admin/admin_base.html' %}
{% block content %}

<div class="content">
    <div class="animated fadeIn">
        <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-header">
                    <strong class="card-title">Categories</strong>
                </div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th scope="col">Category</th>
                                <th scope="col">Cover Photo</th>
                                <th scope="col" colspan="2">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for c in categories %}
                            <tr>
                                <td>{{c.category}}</td>
                                <td><img src="../static/media/{{c.category_image}}" alt="" height="250px" width="250px"></td>
                                <!-- <td><a href="/admin_update_category?id={{c.id}}"><button class="btn btn-info">Update</button></a></td> -->
                                <td><a href="/admin_delete_category?id={{c.id}}"><button class="btn btn-danger">Delete</button></a></td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

</div>
</div>
</div>


{% endblock %}
