{% extends 'admin/admin_base.html' %}
{% block content %}

<div class="col-lg-12">
    <div class="card">
        <div class="card-header">
            <strong>Add</strong> Category
        </div>
        <div class="card-body card-block">
            <form method="post" enctype="multipart/form-data" class="form-horizontal">
                {% csrf_token %}
                <div class="row form-group">
                    <div class="col col-md-3"><label for="text-input" class=" form-control-label">Category</label></div>
                    <div class="col-12 col-md-9"><input type="text" id="text-input" name="category" value="{{category.category}}" placeholder="Category" class="form-control"><small class="form-text text-muted">This is a help text</small></div>
                </div>
                <div class="row form-group">
                    <div class="col col-md-3"><label for="text-input" class=" form-control-label">Category Image</label></div>
                    <div class="col-12 col-md-9"><input type="file" id="text-input" name="category_image" value="{{category.category}}" placeholder="Category" class="form-control"><small class="form-text text-muted">This is a help text</small></div>
                </div>
               
                <div>
                    <button type="submit" class="btn btn-primary">
                     Update
                    </button>
                    
                </div>
            </form>
        </div>
       
    </div>
</div>

{% endblock %}
