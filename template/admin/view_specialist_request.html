{% extends 'admin/admin_base.html' %}
{% block content %}

<div class="content">
    <div class="animated fadeIn">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header">
                        <strong class="card-title">Specialist Requests</strong>
                    </div>
                    <div class="table-stats order-table ov-h">
                        <table class="table ">
                            <thead>
                                <tr>
                                    <th class="avatar">Avatar</th>
                                    <th>Name</th>
                                    <th>Contact</th>
                                    <th>Email</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for s in specialists %}
                                <tr>
                                    <td class="avatar">
                                        <div class="round-img">
                                            <a href="/admin_view_specialist_request_single?id={{s.id}}"><img class="rounded-circle" src="../static/media/{{s.profile_picture}}" alt=""></a>
                                        </div>
                                    </td>
                                    <td><span class="name">{{s.name}}</span> </td>
                                    <td><span class="product">{{s.contact}}</span> </td>
                                    <td><span class="product">{{s.email}}</span> </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div> <!-- /.table-stats -->
                </div>
            </div>

{% endblock %}
