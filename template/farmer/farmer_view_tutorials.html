{% extends 'farmer/farmer_base.html' %}
{% block content %}

<section class="w3l-banner-agency py-5" id="work">
    <div class="midd-w3 py-md-4">
        {% for t in tutorials %}
        <div class="container mb-5">
            <!-- Display the title above the video -->
            <h6 class="title-subw3hny text-center mb-3">{{ t.title }}</h6>
            <div class="about-img-top mb-4">
                <!-- Center the video and keep it responsive -->
                <div class="ratio ratio-16x9">
                    <iframe width="1280" height="720" src="{{ t.video_link }}" 
                            title="{{ t.title }}" frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            referrerpolicy="strict-origin-when-cross-origin" 
                            allowfullscreen>
                    </iframe>
                </div>
            </div>
            <!-- Display the description properly aligned below the video -->
            <div class="row">
                <div class="col-lg-12 text-left">
                    <p class="text-center">{{ t.description }}</p>
                </div>
            </div>
        </div>
        <hr>
        {% endfor %}
    </div>
</section>

{% endblock %}
