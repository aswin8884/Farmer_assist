{% extends 'farmer/farmer_base.html' %}
{% block content %}

<section class="w3l-circles py-5" id="payment">
    <div class="container py-md-5 py-2">
        <!-- Payment Summary -->
        <div class="row w3l-circles">
            <div class="col-lg-6 circles-left">
                <img src="../static/media/{{ booking.product_id.product_image }}" alt="{{ product }}" class="radius-image img-fluid">
            </div>
            <div class="col-lg-6 circles-right mt-lg-0 mt-5 align-self position-relative">
                <h6 class="title-subw3hny">Payment</h6>
                <h3 class="title-w3l mb-4">Amount to pay: {{booking.total_price}} RS/-</h3>

                <!-- Payment Icons -->
                <div class="mb-4">
                    <img src="../static/assets/images/visa.png" alt="Visa" style="width: 50px; margin-right: 10px;">
                    <img src="../static/assets/images/mastercard.png" alt="Mastercard" style="width: 50px; margin-right: 10px;">
                </div>
                
                <!-- Payment Form -->
                <form method="post"  class="mt-4">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="card_name" class="form-label">Cardholder Name</label>
                        <input type="text" id="card_name" name="card_name" class="form-control" placeholder="Enter cardholder name" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="card_number" class="form-label">Card Number</label>
                        <input type="text" id="card_number" name="card_number" class="form-control" placeholder="1234 5678 9012 3456" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="expiry_date" class="form-label">Expiry Date</label>
                            <input type="text" id="expiry_date" name="expiry_date" class="form-control" placeholder="MM/YY" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="cvv" class="form-label">CVV</label>
                            <input type="password" id="cvv" name="cvv" class="form-control" placeholder="123" required>
                        </div>
                    </div>

                    <div class="w3banner-content-btns mt-4">
                        <button type="submit" class="btn btn-style btn-primary mt-lg-3 mt-2">Pay Now <i class="fas fa-credit-card ms-2"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

{% endblock %}
